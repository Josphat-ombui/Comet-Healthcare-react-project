          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportRunEnvelope' }
        '401': { description: Missing or invalid bearer token. }
        '403': { description: Missing `reporting.run.read`. }
        '404': { description: Tenant-scoped run not found. }
  /api/reporting/runs/{id}/job:
    get:
