    FinanceInvoiceLine:
      type: object
      required: [id, description, qty, unitPriceCents, netCents, taxCents, grossCents]
      properties:
        id: { type: string }
        description: { type: string }
        qty: { type: number }
        unitPriceCents: { type: integer, description: Integer cents. }
        taxRateId: { type: string, nullable: true }
        netCents: { type: integer, description: Integer cents. }
        taxCents: { type: integer, description: Integer cents. }
        grossCents: { type: integer, description: Integer cents. }
    FinanceInvoice:
      type: object
      required: [id, number, direction, type, status, partyId, issueDate, currency, taxInclusive, subtotalCents, taxCents, totalCents, paidCents, balanceCents]
      properties:
        id: { type: string }
        number: { type: string }
        direction: { type: string, enum: [SALES, PURCHASE] }
        type: { type: string, enum: [INVOICE, CREDIT_NOTE] }
        status: { type: string, enum: [DRAFT, ISSUED, PARTIALLY_PAID, PAID, OVERDUE, CANCELLED] }
        partyId: { type: string }
        issueDate: { type: string, description: ISO date (`YYYY-MM-DD`). }
        dueDate: { type: string, nullable: true, description: ISO date (`YYYY-MM-DD`). }
        currency: { type: string, example: KES }
        taxInclusive: { type: boolean }
        taxRateId: { type: string, nullable: true, description: VERIFIED statutory rate used for tax calculations. }
        subtotalCents: { type: integer, description: Integer cents. }
        taxCents: { type: integer, description: Integer cents. }
        totalCents: { type: integer, description: Integer cents. }
        paidCents: { type: integer, description: Integer cents. }
        balanceCents: { type: integer, description: Integer cents. }
        notes: { type: string, nullable: true }
        classification: { $ref: '#/components/schemas/Classification' }
        issuedAt: { type: string, format: date-time, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/FinanceInvoiceLine' }
    FinanceInvoiceCreateRequest:
      type: object
      required: [direction, type, partyId, issueDate, taxInclusive, lines]
      properties:
        direction: { type: string, enum: [SALES, PURCHASE] }
        type: { type: string, enum: [INVOICE, CREDIT_NOTE] }
        partyId: { type: string }
        issueDate: { type: string, description: ISO date (`YYYY-MM-DD`). }
        dueDate: { type: string, description: ISO date (`YYYY-MM-DD`). }
        taxInclusive: { type: boolean }
        taxRateId: { type: string, description: Optional VERIFIED statutory rate; rateBps is never supplied by the client. }
        notes: { type: string, maxLength: 3000 }
        classification: { $ref: '#/components/schemas/Classification' }
        lines:
          type: array
          minItems: 1
          maxItems: 60
          items:
            type: object
            required: [description, qty, unitPriceCents]
            properties:
              description: { type: string, maxLength: 240 }
              qty: { type: number, exclusiveMinimum: 0 }
              unitPriceCents: { type: integer, minimum: 1 }
    FinancePayment:
      type: object
      required: [id, number, direction, partyId, method, amountCents, currency]
      properties:
        id: { type: string }
        number: { type: string }
        direction: { type: string, enum: [INCOMING, OUTGOING] }
        partyId: { type: string }
        method: { type: string, enum: [BANK_TRANSFER, MPESA, CASH, CHEQUE, CARD_TOKEN, OTHER], description: Method identifier only; no PAN or CVV is accepted or emitted. }
        amountCents: { type: integer, description: Integer cents. }
        currency: { type: string, example: KES }
        paidAt: { type: string, format: date-time, nullable: true }
        reference: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED] }
        allocations:
          type: array
          items:
            type: object
            required: [invoiceId, amountCents]
            properties:
              invoiceId: { type: string }
              amountCents: { type: integer, description: Integer cents. }
        classification: { $ref: '#/components/schemas/Classification' }
    FinancePaymentCreateRequest:
      type: object
      required: [direction, partyId, method, amountCents]
      properties:
        direction: { type: string, enum: [INCOMING, OUTGOING] }
        partyId: { type: string }
        method: { type: string, enum: [BANK_TRANSFER, MPESA, CASH, CHEQUE, CARD_TOKEN, OTHER] }
        amountCents: { type: integer, minimum: 1, description: Integer cents. }
        paidAt: { type: string, format: date-time }
        reference: { type: string, maxLength: 120 }
        allocations:
          type: array
          items:
            type: object
            required: [invoiceId, amountCents]
            properties:
              invoiceId: { type: string }
              amountCents: { type: integer, minimum: 1 }
      description: No card number, PAN or CVV field exists; CARD_TOKEN denotes a token handled outside this API.
    FinanceBudget:
      type: object
      required: [id, code, name, period, startDate, endDate, status]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        period: { type: string, enum: [MONTHLY, QUARTERLY, ANNUAL] }
        startDate: { type: string, description: ISO date (`YYYY-MM-DD`). }
        endDate: { type: string, description: ISO date (`YYYY-MM-DD`). }
        status: { type: string, enum: [DRAFT, APPROVED, CLOSED] }
        approvedAt: { type: string, format: date-time, nullable: true }
        lines:
          type: array
          items:
            type: object
            required: [accountId, amountCents]
            properties:
              accountId: { type: string }
              amountCents: { type: integer, description: Integer cents. }
        classification: { $ref: '#/components/schemas/Classification' }
    FinanceBudgetCreateRequest:
      type: object
      required: [code, name, period, startDate, endDate, lines]
      properties:
        code: { type: string, minLength: 1, maxLength: 60 }
        name: { type: string, minLength: 1, maxLength: 160 }
        period: { type: string, enum: [MONTHLY, QUARTERLY, ANNUAL] }
        startDate: { type: string, description: ISO date (`YYYY-MM-DD`). }
        endDate: { type: string, description: ISO date (`YYYY-MM-DD`). }
        classification: { $ref: '#/components/schemas/Classification' }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [accountId, amountCents]
            properties:
              accountId: { type: string }
              amountCents: { type: integer, minimum: 0 }
    FinanceStatement:
      type: object
      required: [title, columns, rows, totals]
      description: Generic report shape. Every amount in `rows` and `totals` is an integer number of cents.
      properties:
        title: { type: string }
        columns:
          type: array
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        totals:
          type: object
          additionalProperties: true
    EtimsSubmission:
      type: object
      required: [id, invoiceId, status, payloadVersion, attempts, queuedAt]
      description: Internal ready-only queue record. Not a live KRA filing or submission receipt.
      properties:
        id: { type: string }
        invoiceId: { type: string }
        status: { type: string, enum: [QUEUED, PENDING, SUBMITTED, FAILED], description: Status of the internal queue only. }
        payloadVersion: { type: string, example: '1.0' }
        provider: { type: string, nullable: true, description: Certified provider label for the internal queue; no live filing is performed. }
        externalReference: { type: string, nullable: true, description: Internal reference only; not a KRA filing receipt. }
        attempts: { type: integer, minimum: 0 }
        lastError: { type: string, nullable: true }
        queuedAt: { type: string, format: date-time, nullable: true }
        submittedAt: { type: string, format: date-time, nullable: true }
    EtimsPayload:
      type: object
      description: |
        Provider-agnostic payload built for the internal queue. Contains encrypted PIN
        references only and is never filed to KRA. Unlike finance API money fields, the
        external-style payload uses decimal strings for presentation amounts; this object
        is not a finance money field.
      properties:
        schemaVersion: { type: string, example: '1.0', description: Value of ETIMS_PAYLOAD_VERSION. }
        provider: { type: string, example: internal-queue, description: Value of ETIMS_PROVIDER; an internal queue label, not a live filing integration. }
        documentType: { type: string, enum: [Invoice, CreditNote] }
        supplierPinRef: { type: string, nullable: true, description: Encrypted PIN reference, never a plaintext PIN. }
        buyerPinRef: { type: string, nullable: true, description: Encrypted PIN reference, never a plaintext PIN. }
        invoiceNumber: { type: string }
        issueDate: { type: string, description: ISO date (`YYYY-MM-DD`). }
        currency: { type: string, example: KES }
        taxInclusive: { type: boolean }
        classification: { $ref: '#/components/schemas/Classification' }
        lines:
          type: array
          items:
            type: object
            properties:
              description: { type: string }
              qty: { type: number }
              unitPrice: { type: string, description: Decimal presentation amount, not integer cents. }
              vatRate: { type: number, description: Fraction derived from a VERIFIED statutory rate (rateBps / 10000). }
              netAmount: { type: string }
              vatAmount: { type: string }
              grossAmount: { type: string }
        totals:
          type: object
          properties:
            net: { type: string, description: Decimal presentation amount, not integer cents. }
            vat: { type: string }
            gross: { type: string }
      x-queue-note: Ready-only internal queue; no live KRA filing or submission occurs.
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - correlationId
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
    SalesQuoteStatus:
      type: string
      enum: [DRAFT, SENT, ACCEPTED, REJECTED, CONVERTED, EXPIRED, CANCELLED]
    SalesOrderStatus:
      type: string
      enum: [DRAFT, CONFIRMED, FULFILLED, CANCELLED]
    DeliveryNoteStatus:
      type: string
      enum: [DRAFT, ISSUED, IN_TRANSIT, DELIVERED, CANCELLED]
    SalesReturnStatus:
      type: string
      enum: [DRAFT, APPROVED, RECEIVED, REJECTED, CANCELLED]
