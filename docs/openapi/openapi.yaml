          description: Tenant-scoped widgets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardWidgetListEnvelope' }
        '401': { description: Missing or invalid bearer token. }
        '403': { description: Missing `reporting.dashboard.read`. }
        '404': { description: Tenant-scoped dashboard not found. }
    post:
      tags: [Reporting]
      summary: Create a dashboard widget
      operationId: createReportingWidget
      x-permission: reporting.dashboard.write
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportingDashboardId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardWidgetCreate' }
      responses:
        '201':
          description: Created widget.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardWidgetEnvelope' }
        '400': { description: Invalid report key or DLP rejection. }
        '401': { description: Missing or invalid bearer token. }
        '403': { description: Missing `reporting.dashboard.write`. }
        '404': { description: Tenant-scoped dashboard not found. }
  /api/reporting/widgets/{id}:
    get:
      tags: [Reporting]
      summary: Get a dashboard widget
      operationId: getReportingWidget
      x-permission: reporting.dashboard.read
