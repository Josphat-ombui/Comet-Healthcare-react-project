      operationId: getReportingRunJob
      x-permission: reporting.run.read
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportingResourceId'
      responses:
        '200':
          description: ID-only job status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportRunJobEnvelope' }
        '401': { description: Missing or invalid bearer token. }
        '403': { description: Missing `reporting.run.read`. }
        '404': { description: Tenant-scoped run not found. }
  /api/reporting/dashboards:
    get:
      tags: [Reporting]
      summary: List dashboards
      operationId: listReportingDashboards
      x-permission: reporting.dashboard.read
      security:
        - bearerAuth: []
