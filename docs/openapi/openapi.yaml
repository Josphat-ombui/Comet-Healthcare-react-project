      properties:
        id: { type: string }
        accountId: { type: string }
        partyId: { type: string, nullable: true }
        debitCents: { type: integer, minimum: 0, description: Integer cents. }
        creditCents: { type: integer, minimum: 0, description: Integer cents. }
        memo: { type: string, nullable: true }
        position: { type: integer }
    FinanceJournal:
      type: object
      required: [id, number, date, description, status]
      properties:
        id: { type: string }
        number: { type: string }
        date: { type: string, description: ISO date (`YYYY-MM-DD`). }
        description: { type: string }
        status: { type: string, enum: [DRAFT, POSTED, REVERSED] }
        referenceType: { type: string, nullable: true }
        referenceId: { type: string, nullable: true }
        reversalOfId: { type: string, nullable: true }
        postedAt: { type: string, format: date-time, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/FinanceJournalLine' }
        classification: { $ref: '#/components/schemas/Classification' }
    FinanceJournalCreateRequest:
      type: object
      required: [date, description, lines]
      properties:
        date: { type: string, description: ISO date (`YYYY-MM-DD`). }
        description: { type: string, minLength: 1, maxLength: 300 }
        referenceType: { type: string, maxLength: 40 }
        referenceId: { type: string, maxLength: 80 }
        classification: { $ref: '#/components/schemas/Classification' }
        lines:
          type: array
          minItems: 2
          items:
            type: object
            required: [accountId, debitCents, creditCents]
            properties:
              accountId: { type: string }
              partyId: { type: string }
              debitCents: { type: integer, minimum: 0 }
              creditCents: { type: integer, minimum: 0 }
              memo: { type: string, maxLength: 240 }
