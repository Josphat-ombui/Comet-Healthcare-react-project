        - $ref: '#/components/parameters/ReportingLimit'
      responses:
        '200':
          description: Tenant-scoped dashboards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportingDashboardListEnvelope' }
        '401': { description: Missing or invalid bearer token. }
        '403': { description: Missing `reporting.dashboard.read`. }
    post:
      tags: [Reporting]
      summary: Create a dashboard
      operationId: createReportingDashboard
      x-permission: reporting.dashboard.write
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportingDashboardCreate' }
      responses:
        '201':
          description: Created dashboard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportingDashboardEnvelope' }
        '400': { description: Invalid request or DLP rejection. }
        '401': { description: Missing or invalid bearer token. }
        '403': { description: Missing `reporting.dashboard.write`. }
  /api/reporting/dashboards/{id}:
    get:
      tags: [Reporting]
      summary: Get a dashboard with its widgets
      operationId: getReportingDashboard
      x-permission: reporting.dashboard.read
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportingResourceId'
      responses:
        '200':
          description: Tenant-scoped dashboard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportingDashboardEnvelope' }
        '401': { description: Missing or invalid bearer token. }
        '403': { description: Missing `reporting.dashboard.read`. }
        '404': { description: Tenant-scoped dashboard not found. }
    patch:
      tags: [Reporting]
