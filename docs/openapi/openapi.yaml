          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardWidgetEnvelope' }
        '401': { description: Missing or invalid bearer token. }
        '403': { description: Missing `reporting.dashboard.read`. }
        '404': { description: Tenant-scoped widget not found. }
    patch:
      tags: [Reporting]
      summary: Update a dashboard widget
      operationId: updateReportingWidget
      x-permission: reporting.dashboard.write
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportingResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardWidgetUpdate' }
      responses:
        '200':
          description: Updated widget.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardWidgetEnvelope' }
        '400': { description: Invalid report key or DLP rejection. }
        '401': { description: Missing or invalid bearer token. }
        '403': { description: Missing `reporting.dashboard.write`. }
        '404': { description: Tenant-scoped widget not found. }
    delete:
      tags: [Reporting]
      summary: Soft-delete a dashboard widget
      operationId: deleteReportingWidget
      x-permission: reporting.dashboard.write
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportingResourceId'
      responses:
        '200':
          description: Soft-deleted widget.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardWidgetEnvelope' }
        '401': { description: Missing or invalid bearer token. }
