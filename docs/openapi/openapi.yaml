          application/json:
            schema: { $ref: '#/components/schemas/ReportDefinitionUpdate' }
      responses:
        '200':
          description: Updated definition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportDefinitionEnvelope' }
        '400': { description: Invalid key/specification or DLP rejection. }
        '401': { description: Missing or invalid bearer token. }
        '403': { description: Missing `reporting.definition.write`. }
        '404': { description: Tenant-scoped definition not found. }
    delete:
      tags: [Reporting]
      summary: Soft-delete a report definition
      operationId: deleteReportingDefinition
      x-permission: reporting.definition.write
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportingResourceId'
      responses:
        '200':
          description: Soft-deleted definition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportDefinitionEnvelope' }
        '401': { description: Missing or invalid bearer token. }
        '403': { description: Missing `reporting.definition.write`. }
        '404': { description: Tenant-scoped definition not found. }
  /api/reporting/runs:
    get:
      tags: [Reporting]
      summary: List report runs
      operationId: listReportingRuns
      x-permission: reporting.run.read
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReportRunStatus' }
        - name: definitionId
          in: query
          schema: { type: string, minLength: 1, maxLength: 80 }
        - $ref: '#/components/parameters/ReportingReportKeyFilter'
        - $ref: '#/components/parameters/ReportingLimit'
      responses:
        '200':
          description: Tenant-scoped runs with status and result summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportRunListEnvelope' }
        '401': { description: Missing or invalid bearer token. }
        '403': { description: Missing `reporting.run.read`. }
    post:
      tags: [Reporting]
      summary: Queue a report run
      description: Enqueues `reporting.run` with an ID-only payload; falls back to synchronous execution when queues are disabled.
      operationId: createReportingRun
      x-permission: reporting.run.write
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRunCreate' }
      responses:
        '201':
          description: Queued, running or completed run. Poll the run for its terminal status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportRunEnvelope' }
        '400': { description: Invalid typed parameters or unknown fields. }
        '401': { description: Missing or invalid bearer token. }
        '403': { description: Missing `reporting.run.write`. }
        '404': { description: Tenant-scoped definition not found. }
  /api/reporting/runs/{id}:
    get:
      tags: [Reporting]
      summary: Get a report run
      operationId: getReportingRun
      x-permission: reporting.run.read
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportingResourceId'
      responses:
        '200':
