    post:
      tags: [Sales]
      summary: Mark a delivery note delivered
      description: ISSUED or IN_TRANSIT to DELIVERED. Terminal.
      operationId: deliverSalesDelivery
      x-permission: sales.delivery.issue
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SalesDocumentId'
      responses:
        '200':
          description: Delivered note.
          content:
            application/json:
              schema:
                type: object
                required: [delivery]
                properties:
                  delivery: { $ref: '#/components/schemas/DeliveryNote' }
        '409': { description: Invalid status transition. }
  /api/sales/returns:
    get:
      tags: [Sales]
      summary: List sales returns
      operationId: listSalesReturns
      x-permission: sales.return.read
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/SalesReturnStatus' }
        - name: deliveryNoteId
          in: query
          schema: { type: string }
        - name: partyId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Returns visible to the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesReturnList' }
    post:
      tags: [Sales]
      summary: Create a draft sales return
      description: Use a deliveryNoteId, an orderId, or both partyId and at least one line. Not both source IDs.
      operationId: createSalesReturn
      x-permission: sales.return.write
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesReturnCreate' }
      responses:
        '201':
          description: Created draft return.
          content:
            application/json:
              schema:
                type: object
                required: [return]
                properties:
                  return: { $ref: '#/components/schemas/SalesReturn' }
  /api/sales/returns/{id}:
    get:
      tags: [Sales]
      summary: Get a sales return with lines
      operationId: getSalesReturn
      x-permission: sales.return.read
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SalesDocumentId'
      responses:
        '200':
          description: Return detail.
          content:
            application/json:
              schema:
                type: object
                required: [return]
                properties:
                  return: { $ref: '#/components/schemas/SalesReturn' }
    patch:
      tags: [Sales]
      summary: Update a draft sales return
      operationId: updateSalesReturn
      x-permission: sales.return.write
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SalesDocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesReturnUpdate' }
      responses:
        '200':
          description: Updated return.
          content:
            application/json:
              schema:
                type: object
                required: [return]
                properties:
                  return: { $ref: '#/components/schemas/SalesReturn' }
        '409': { description: Return is no longer DRAFT. }
  /api/sales/returns/{id}/approve:
    post:
      tags: [Sales]
      summary: Approve a sales return
      description: DRAFT to APPROVED. Emits SalesReturnApproved with IDs only.
      operationId: approveSalesReturn
      x-permission: sales.return.approve
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SalesDocumentId'
      responses:
        '200':
          description: Approved return.
          content:
            application/json:
              schema:
                type: object
                required: [return]
                properties:
                  return: { $ref: '#/components/schemas/SalesReturn' }
        '409': { description: Invalid status transition. }
  /api/sales/returns/{id}/receive:
    post:
      tags: [Sales]
      summary: Receive an approved sales return
      description: APPROVED to RECEIVED. Terminal.
      operationId: receiveSalesReturn
      x-permission: sales.return.approve
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SalesDocumentId'
      responses:
        '200':
          description: Received return.
          content:
            application/json:
              schema:
                type: object
                required: [return]
                properties:
                  return: { $ref: '#/components/schemas/SalesReturn' }
        '409': { description: Invalid status transition. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token for ERP/CMS users.
    cookieAuth:
      type: apiKey
      in: cookie
      name: comet_refresh
      description: HttpOnly, Secure, SameSite=Strict refresh session cookie.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Scoped public API key with per-key rate limits.
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.example.invalid/oauth/token
          scopes:
            public:read: Read permitted public resources.
            public:write: Write permitted public resources.
  headers:
    CorrelationId:
      description: Stable identifier propagated through logs, events, and jobs.
      schema:
        type: string
        example: cor_01JQ8Z3M9K2P7YV4
    IdempotencyKey:
      description: |
        Client-generated unique key for a message send. Reusing the same key replays
        the original message instead of creating a duplicate. Required only for
        `POST /api/messaging/threads/{id}/messages`; Phase 5 endpoints do not use it.
      schema:
        type: string
        maxLength: 200
      required: true
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key for messaging sends only; safe replays return the original message. Not used by Phase 5 endpoints.
      schema: { type: string, minLength: 1, maxLength: 200 }
    SalesDocumentId:
      name: id
      in: path
      required: true
      description: Opaque sales document ID scoped to the caller's tenant.
      schema: { type: string }
  schemas:
    Inbox:
      type: object
      required: [id, code, name, kind]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        internalAddress: { type: string, nullable: true }
        kind: { type: string, enum: [PERSONAL, DEPARTMENT, ROLE, BRANCH, SHARED] }
        branchId: { type: string, nullable: true }
        departmentId: { type: string, nullable: true }
        classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED] }
        isActive: { type: boolean }
    Thread:
      type: object
      required: [id, subject, status, priority]
      properties:
        id: { type: string }
        companyId: { type: string }
        branchId: { type: string, nullable: true }
        inboxId: { type: string, nullable: true }
        channelId: { type: string, nullable: true }
        subject: { type: string }
        status: { type: string, enum: [OPEN, PENDING, RESOLVED, CLOSED] }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
        assignedToId: { type: string, nullable: true }
        createdById: { type: string }
        lastMessageAt: { type: string, format: date-time }
        snoozedUntil: { type: string, format: date-time, nullable: true }
        archived: { type: boolean }
        classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED] }
        messageCount: { type: integer }
        access: { type: string, nullable: true }
        canSeeInternal: { type: boolean }
    Message:
      type: object
      required: [id, threadId, senderId, body, visibility, createdAt]
      properties:
        id: { type: string }
        threadId: { type: string }
        senderId: { type: string }
        senderName: { type: string }
        senderInboxId: { type: string, nullable: true }
        body: { type: string, description: Recalled messages render a placeholder. }
        visibility: { type: string, enum: [RECIPIENT, INTERNAL] }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
        classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED] }
        recalledAt: { type: string, format: date-time, nullable: true }
        editedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        reactions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              userId: { type: string }
              emoji: { type: string }
              createdAt: { type: string, format: date-time }
        receipts:
          type: array
          description: Always empty for INTERNAL notes. BCC recipients are hidden from non-senders.
          items:
            type: object
            properties:
              userId: { type: string, nullable: true }
              inboxId: { type: string, nullable: true }
              status: { type: string }
              deliveredAt: { type: string, format: date-time, nullable: true }
              readAt: { type: string, format: date-time, nullable: true }
        edits: { type: array, items: { type: object } }
        attachments: { type: array, items: { type: object } }
    User:
      type: object
      required: [id, email, firstName, lastName, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string, nullable: true }
        role: { type: string, enum: [ADMIN, MANAGER, STAFF, COMPLIANCE, PATIENT, PROVIDER] }
        status: { type: string, enum: [ACTIVE, INVITED, SUSPENDED, DISABLED] }
        branchId: { type: string, nullable: true }
        mfaEnabled: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    Session:
      type: object
      properties:
        id: { type: string }
        current: { type: boolean }
        userAgent: { type: string, nullable: true }
        ipAddress: { type: string, nullable: true }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    SignInResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: Access JWT. }
        user: { $ref: '#/components/schemas/User' }
        sessionId: { type: string }
        expiresIn: { type: string }
        mfaRequired: { type: boolean, default: false }
    MfaChallengeResponse:
      type: object
      required: [mfaRequired, challenge]
      properties:
        mfaRequired: { type: boolean, enum: [true] }
        challenge: { type: string, description: Short-lived MFA JWT. }
        token: { type: string, nullable: true }
        user: { $ref: '#/components/schemas/User' }
    HealthStatus:
      type: object
      required:
        - status
        - correlationId
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - unavailable
        correlationId:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
          example:
            postgres: ok
            redis: ok
            objectStorage: ok
    Classification:
      type: string
      enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]
      description: Shared classification vocabulary used by Phase 4 and Phase 5 payloads.
    FileDto:
      type: object
      description: Public file projection. Object keys, checksums and tenant identifiers are never returned.
      required: [id, name, mimeType, size, classification, status, version, purpose, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        mimeType: { type: string }
        size: { type: integer, format: int64, minimum: 1 }
        classification: { $ref: '#/components/schemas/Classification' }
        status: { type: string, enum: [PENDING, CLEAN, INFECTED, QUARANTINED] }
        version: { type: integer, minimum: 1 }
        purpose: { type: string, enum: [GENERAL, MESSAGE_ATTACHMENT, DOCUMENT, PROFILE] }
        folder: { type: string, nullable: true }
        uploadedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FileUploadRequest:
      type: object
      required: [name, mimeType, size]
      properties:
        name: { type: string, minLength: 1, maxLength: 240 }
        mimeType: { type: string, minLength: 3, maxLength: 120 }
        size: { type: integer, format: int64, minimum: 1 }
        classification:
          allOf:
            - $ref: '#/components/schemas/Classification'
          default: INTERNAL
        purpose: { type: string, enum: [GENERAL, MESSAGE_ATTACHMENT, DOCUMENT, PROFILE], default: GENERAL }
        folder: { type: string, maxLength: 120 }
        checksum: { type: string, maxLength: 128, description: Optional SHA-256 hex digest. }
    FileConfirmRequest:
      type: object
      properties:
        checksum: { type: string, maxLength: 128 }
        status: { type: string, enum: [PENDING, CLEAN, INFECTED, QUARANTINED], default: PENDING }
    UploadTicket:
      type: object
      required: [provider, method, url, expiresIn]
      properties:
        provider: { type: string, enum: [R2, LOCAL] }
        method: { type: string, enum: [PUT, POST], description: PUT for R2, POST for the encrypted local fallback. }
        url: { type: string, format: uri-reference, description: Absolute signed R2 URL or relative local upload ticket URL. }
        headers:
          type: object
          additionalProperties: { type: string }
          example: { Content-Type: application/octet-stream }
        expiresIn: { type: integer, description: Ticket lifetime in seconds (`SIGNED_URL_TTL_SECONDS`). }
    DownloadTicket:
      type: object
      required: [provider, method, url, expiresIn]
      properties:
        provider: { type: string, enum: [R2, LOCAL] }
        method: { type: string, enum: [GET] }
        url: { type: string, format: uri-reference }
        expiresIn: { type: integer, description: Ticket lifetime in seconds. }
    WorkflowStep:
      type: object
      required: [key, label]
      properties:
        key: { type: string, minLength: 2, maxLength: 80, pattern: '^[a-z0-9_-]+$' }
        label: { type: string, minLength: 2, maxLength: 160 }
        assigneeRole: { type: string, enum: [ADMIN, MANAGER, STAFF, COMPLIANCE] }
        assigneeUserId: { type: string, maxLength: 80 }
        requireReason: { type: boolean, default: false }
    WorkflowDefinition:
      type: object
      required: [id, code, name, version, steps, active, classification]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        version: { type: integer, minimum: 1 }
        steps:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/WorkflowStep' }
        active: { type: boolean }
        classification: { $ref: '#/components/schemas/Classification' }
        createdById: { type: string, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
    WorkflowDefinitionRequest:
      type: object
      required: [code, name, steps]
      properties:
        code: { type: string, minLength: 2, maxLength: 60, pattern: '^[a-z0-9_-]+$' }
        name: { type: string, minLength: 2, maxLength: 160 }
        description: { type: string, maxLength: 500 }
        steps:
          type: array
          minItems: 1
          maxItems: 12
          items: { $ref: '#/components/schemas/WorkflowStep' }
        classification:
          allOf:
            - $ref: '#/components/schemas/Classification'
          default: INTERNAL
        active: { type: boolean, default: true }
    WorkflowInstance:
      type: object
      required: [id, definitionId, entityType, status, requestedById]
      properties:
        id: { type: string }
        branchId: { type: string, nullable: true }
        definitionId: { type: string }
        definition:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
        entityType: { type: string }
        entityId: { type: string, nullable: true }
        status: { type: string, enum: [RUNNING, COMPLETED, REJECTED] }
        currentStep: { type: string, nullable: true }
        context: { type: object, nullable: true }
        requestedById: { type: string }
        createdAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/WorkflowTask' }
    WorkflowTask:
      type: object
      required: [id, instanceId, stepKey, title, status]
      properties:
        id: { type: string }
        instanceId: { type: string }
        stepKey: { type: string }
        title: { type: string }
        assigneeId: { type: string, nullable: true }
        delegatedFromId: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED, DELEGATED] }
        decision: { type: string, enum: [APPROVED, REJECTED], nullable: true }
        comment: { type: string, nullable: true }
        dueAt: { type: string, format: date-time, nullable: true }
        actedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        instance: { $ref: '#/components/schemas/WorkflowInstance' }
    WorkflowStartRequest:
      type: object
      required: [definitionCode, entityType]
      properties:
        definitionCode: { type: string, minLength: 2, maxLength: 60 }
        entityType: { type: string, minLength: 2, maxLength: 40 }
        entityId: { type: string, maxLength: 80 }
        branchId: { type: string, nullable: true }
        context: { type: object, additionalProperties: true }
    WorkflowTaskDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVED, REJECTED] }
        comment: { type: string, maxLength: 1000 }
    WorkflowDelegateRequest:
      type: object
      required: [toUserId]
      properties:
        toUserId: { type: string, minLength: 2, maxLength: 80 }
        comment: { type: string, maxLength: 1000 }
    NotificationDto:
      type: object
      description: In-app notification content; only the authenticated owner can read it.
      required: [id, userId, category, title, message, classification]
      properties:
        id: { type: string }
        userId: { type: string }
        category: { type: string, enum: [MESSAGE, WORKFLOW, DOCUMENT, FILE, SYSTEM] }
        title: { type: string }
        message: { type: string }
        classification: { $ref: '#/components/schemas/Classification' }
        entityType: { type: string, nullable: true }
        entityId: { type: string, nullable: true }
        readAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
    NotificationPreference:
      type: object
      required: [enabled]
      properties:
        channel: { type: string, enum: [IN_APP], default: IN_APP }
        enabled: { type: boolean }
        digestMinutes: { type: integer, minimum: 0, maximum: 1440, default: 0 }
    SearchResult:
      type: object
      required: [id, entityType, entityId, title, classification]
      properties:
        id: { type: string }
        entityType: { type: string, enum: [MESSAGE, THREAD, DOCUMENT, FILE, WORKFLOW, USER] }
        entityId: { type: string }
        title: { type: string }
        summary: { type: string, nullable: true }
        classification: { $ref: '#/components/schemas/Classification' }
        branchId: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        score: { type: number, description: PostgreSQL `ts_rank` score. }
    SearchResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }
        total: { type: integer, minimum: 0 }
    DocumentKind:
      type: object
      required: [kind, label, financial]
      properties:
        kind: { type: string, enum: [QUOTATION, PROFORMA_INVOICE, INVOICE, ORDER_CONFIRMATION, CDMO_SLA, NDA, COA] }
        label: { type: string }
        financial: { type: boolean }
        days: { type: integer, description: Default validity in days for financial documents. }
        defaultTitle: { type: string }
    DocumentGenerateRequest:
      type: object
      required: [kind, clientName, clientCompany, clientEmail]
      properties:
        kind: { type: string, enum: [QUOTATION, PROFORMA_INVOICE, INVOICE, ORDER_CONFIRMATION, CDMO_SLA, NDA, COA] }
        title: { type: string, maxLength: 220 }
        clientName: { type: string, minLength: 2, maxLength: 120 }
        clientCompany: { type: string, minLength: 2, maxLength: 180 }
        clientEmail: { type: string, format: email }
        clientPhone: { type: string, maxLength: 40 }
        issueDate: { type: string, description: ISO date (`YYYY-MM-DD`). }
        dueDate: { type: string, description: ISO date (`YYYY-MM-DD`). }
        validUntil: { type: string, description: ISO date (`YYYY-MM-DD`). }
        notes: { type: string, maxLength: 3000 }
        items:
          type: array
          maxItems: 60
          items:
            type: object
            required: [description, qty, unitPrice]
            properties:
              description: { type: string, maxLength: 240 }
              qty: { type: number, minimum: 0 }
              unitPrice: { type: number, minimum: 0 }
        clauses:
          type: array
          maxItems: 40
          items:
            type: object
            required: [title, body]
            properties:
              title: { type: string, maxLength: 200 }
              body: { type: string, maxLength: 6000 }
        productInfo:
          type: object
          required: [product]
          properties:
            product: { type: string, maxLength: 200 }
            batch: { type: string, maxLength: 80 }
            dosageForm: { type: string, maxLength: 120 }
            manufacturingDate: { type: string }
            expiryDate: { type: string }
            storage: { type: string, maxLength: 160 }
        params:
          type: array
          maxItems: 60
          items:
            type: object
            required: [parameter, result, limit]
            properties:
              parameter: { type: string, maxLength: 120 }
              method: { type: string, maxLength: 160 }
              result: { type: string, maxLength: 160 }
              limit: { type: string, maxLength: 200 }
              status: { type: string, enum: [PASS, FAIL, N/A], default: PASS }
    BusinessDocument:
      type: object
      required: [id, number, kind, title, status, currency]
      properties:
        id: { type: string }
        number: { type: string, description: Human-readable document code used as the `code` path parameter. }
        kind: { type: string, enum: [QUOTATION, PROFORMA_INVOICE, INVOICE, ORDER_CONFIRMATION, CDMO_SLA, NDA, COA] }
        title: { type: string }
        status: { type: string, enum: [DRAFT, ISSUED, VOID] }
        currency: { type: string }
        taxRate: { type: number }
        issueDate: { type: string }
        dueDate: { type: string, nullable: true }
        validUntil: { type: string, nullable: true }
        clientName: { type: string }
        clientCompany: { type: string }
        clientEmail: { type: string, format: email }
        clientPhone: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        subtotal: { type: number }
        tax: { type: number }
        total: { type: number }
        data: { type: object, description: Rendered line items, clauses and COA parameters. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdBy:
          type: object
          nullable: true
          properties:
            id: { type: string }
            firstName: { type: string }
            lastName: { type: string }
    DocumentJobStatus:
      type: object
      required: [id, name, state, createdAt]
      properties:
        id: { type: string }
        name: { type: string, example: documents.generate }
        state: { type: string, description: BullMQ job state such as waiting, active, completed, failed or delayed. }
        progress: { description: BullMQ-reported progress value or object. }
        failedReason: { type: string, nullable: true }
        returnvalue: { description: Job result containing documentId, number and fileId. }
        createdAt: { type: string, format: date-time }
    FinanceAccount:
      type: object
      required: [id, code, name, type, normalBalance, isActive]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE] }
