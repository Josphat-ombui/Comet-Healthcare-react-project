openapi: 3.1.0
info:
  title: Comet Healthcare Enterprise API
  version: 0.7.0-phase.7
  summary: REST and webhook contract for the Comet Healthcare enterprise platform.
  description: |
    Phase 3 adds local identity, sessions, MFA, OIDC, organisation directory and audit.
    Phase 4 adds tenant-scoped internal messaging, channels, DLP, and realtime events.
    Phase 5 adds shared services: encrypted file objects with short-lived upload/download
    tickets, linear workflow definitions/instances/tasks, in-app-only notifications,
    permission-aware PostgreSQL full-text search, and queued business document generation.
    Tenant and branch context are derived from the authenticated principal; clients must
    never supply companyId directly. Refresh tokens are HttpOnly cookies, never response bodies.

    Internal messaging never uses external SMTP. Recipients are internal user IDs,
    inbox codes/addresses, or `department:`/`role:`/`branch:` aliases. External-looking
    email addresses are rejected with 400 before any lookup. `visibility=INTERNAL` notes are excluded from
    recipient DTOs, receipts, sockets, and audits; only inbox managers and the author
    can see them. DLP fails closed (`DLP_MODE=block`) unless explicitly set to `flag`.

    Every `POST /api/messaging/threads/{id}/messages` requires an `Idempotency-Key`
    header; safe replays return 200 with `replay: true` instead of creating duplicates.
    `Idempotency-Key` is not required for Phase 5 endpoints — it is scoped only to
    messaging sends, and clients must not assume Phase 5 writes are replay-safe.
    Domain events and Socket.IO payloads carry IDs and classification only — no subject,
    body, title, notification text, checksum, object key, or file content. Clients fetch
    content through authenticated endpoints so visibility is always rechecked. Phase 5
    event payload schemas are strict: an extra content field is a contract violation.

    New shared permissions: `files.object.read/write/delete`, `workflow.definition.read/write`,
    `workflow.instance.read`, `workflow.task.approve/delegate`, `notifications.read/manage`,
    `search.read`, and `documents.read/write/issue`. All new endpoints require the bearer
    access token and enforce tenant/branch scope in addition to RLS.

    Phase 6 adds tenant/branch-scoped finance under `/api/finance`: chart of accounts,
    parties, a versioned statutory-rate register with manual verification, double-entry
    journals, invoices, payments, budgets, statements and a ready-only eTIMS payload queue.
    All money fields are integer cents (`*Cents`). `rateBps` (basis points, 10000 = 100%)
    comes only from the versioned statutory-rate table, and only VERIFIED, effective rows
    may be used for finance calculations or invoice issuance. Rates are never hardcoded in
    application code. The legacy storefront `taxRate` field remains outside this table and
    is not used by Phase 6 finance calculations.

    No plaintext tax PIN or card data is stored or emitted. Party tax PINs are encrypted at
    rest and public DTOs expose only `taxPinMasked`; `CARD_TOKEN` is a method name only, and
    no PAN, card number or CVV is accepted anywhere in the API. eTIMS is a ready-only
    internal queue: the `finance.etims.submit` worker records PENDING submissions for a
    certified provider, stores provider-agnostic payloads with encrypted PIN references
    and creates in-app notifications only. It is NOT live filing and never submits to KRA.
    Payload amounts are decimal presentation strings; finance API money fields remain integer cents.

    Phase 7 adds the sales lifecycle under `/api/sales`: quotes, sales orders, delivery notes
    and returns with explicit status transitions, plus quote-to-order conversion and invoice
    creation from a confirmed order. All document money fields are integer cents and all dates
    are strict `YYYY-MM-DD` strings. Sales stores `taxRateId` only as an intended reference;
    it never copies or hardcodes a rate. Invoice creation delegates every tax calculation to
    finance, which applies only a VERIFIED, effective VAT rate. Omitting `taxRateId` is allowed:
    finance then rejects issue when no verified rate is available.

    Phase 7 permissions: `sales.quote.read/write`, `sales.order.read/write/confirm`,
    `sales.delivery.read/write/issue`, `sales.return.read/write/approve` and
    `sales.invoice.create`. Every sales endpoint requires a bearer token. Sales events
    (`SalesQuoteCreated`, `SalesOrderConfirmed`, `DeliveryNoteIssued`, `SalesReturnApproved`,
    `SalesInvoiceCreated`) and their sockets carry IDs and classification only and are routed
    to the company room only. They are invalidation signals; clients refetch through the
    authenticated API. `Idempotency-Key` is still scoped to messaging sends only.

    Phase 6 permissions: `finance.account.read/write`, `finance.journal.read/write/post`,
    `finance.party.read/write`, `finance.invoice.read/write/issue`,
    `finance.payment.read/write`, `finance.budget.read/write`,
    `finance.statutory.read/write/verify`, `finance.statement.read` and
    `finance.etims.read/write`. `Idempotency-Key` remains scoped to messaging sends only;
    no finance endpoint consumes it.
  contact:
    name: Comet Healthcare Platform Team
  license:
    name: Proprietary - internal use
servers:
  - url: https://api.example.invalid
    description: Production (placeholder until domain/provider is confirmed)
  - url: http://localhost:4000
    description: Local development
tags:
  - name: Health
    description: Liveness and readiness checks.
  - name: Identity
    description: Login, users, sessions, MFA, and roles. Added in Phase 3.
  - name: Organisation
    description: Branches and departments. Added in Phase 3.
  - name: Audit
    description: Append-only audit trail and hash verification. Added in Phase 3.
  - name: Messaging
    description: Inboxes, threads, channels, and files. Added in Phase 4.
  - name: Platform
    description: Workflow, files, search, notifications, and documents. Added in Phase 5.
  - name: Finance
    description: Accounts, parties, statutory rates, journals, invoices, payments, budgets, statements and ready-only eTIMS queue. Added in Phase 6.
  - name: Sales
    description: Quotes, orders, delivery notes, returns and finance invoice creation. Added in Phase 7.
x-phase-roadmap:
  phase1: Architecture and this skeleton only
  phase2: ERD, migrations, workspace split, shared contracts
  phase3: /api/auth, /api/identity, /api/org, /api/audit
  phase4: Complete - /api/messaging and realtime events
  phase5: Complete - /api/files, /api/workflow, /api/notifications, /api/search, /api/documents
  phase6: Complete - /api/finance (accounts, parties, statutory rates, journals, invoices, payments, budgets, statements, ready-only eTIMS queue)
  phase7: Complete - /api/sales (quotes, orders, delivery notes, returns, invoice creation from confirmed orders)
  phase8: /api/inventory
  phase9: /api/procurement
  phase10: /api/service
  phase11: /api/hr
  phase12: /api/projects
  phase13: /api/manufacturing
  phase14: /api/reporting
  phase15: /api/public/v1 and /api/webhooks
x-realtime:
  transport: Socket.IO 4 with Redis adapter; client bundle served by the realtime service.
  authentication: |
    GET /api/messaging/realtime-token returns a short-lived JWT (scope=realtime)
    containing companyId, branchIds, roles and an explicit room allow-list.
    The token carries no message content. A token can never join a room outside its tenant.
  rooms:
    - company:{companyId}
    - company:{companyId}:user:{userId}
    - company:{companyId}:branch:{branchId}
    - company:{companyId}:inbox:{inboxId}
    - company:{companyId}:thread:{threadId}
    - company:{companyId}:channel:{channelId}
  clientEvents:
    subscribe:thread: 'Join an additional authorised thread room.'
    typing: 'Broadcast { threadId, isTyping } to a thread room.'
  serverEvents:
    message:new: 'A message was committed; refetch via GET /api/messaging/threads/{id}/messages.'
    message:recalled: 'A message was recalled.'
    thread:assigned: 'Thread assignment changed.'
    thread:resolved: 'Thread status changed to RESOLVED or reopened.'
    reaction:added: 'A reaction was added.'
    presence:update: '{ userId, online } for a tenant member.'
    typing:update: '{ threadId, userId, isTyping }.'
    notification:new: 'NotificationCreated; refetch GET /api/notifications.'
    notification:read: 'NotificationRead; refetch GET /api/notifications.'
    workflow:started: 'WorkflowInstanceStarted; refetch GET /api/workflow/instances.'
    workflow:task: 'WorkflowTaskAssigned; refetch GET /api/workflow/tasks.'
    workflow:completed: 'WorkflowCompleted; refetch GET /api/workflow/instances.'
    file:new: 'FileUploaded; refetch GET /api/files/{id}.'
    file:scanned: 'FileScanned; refetch GET /api/files/{id} for the scan status.'
    document:generated: 'DocumentGenerated; poll GET /api/documents/jobs/{id} or refetch /api/documents.'
    document:issued: 'DocumentIssued; refetch GET /api/documents/{code}.'
    finance:account: 'FinanceAccount changed; refetch GET /api/finance/accounts.'
    finance:journal: 'FinanceJournal changed; refetch GET /api/finance/journals.'
    finance:invoice: 'FinanceInvoice changed; refetch GET /api/finance/invoices.'
    finance:payment: 'FinancePayment changed; refetch GET /api/finance/payments.'
    finance:budget: 'FinanceBudget changed; refetch GET /api/finance/budgets.'
    finance:rate: 'StatutoryRate changed; refetch GET /api/finance/statutory-rates.'
    finance:etims: 'EtimsSubmission queued or progressed; refetch GET /api/finance/etims/submissions. Internal queue only, not live filing.'
    finance:etims-failed: 'EtimsSubmission failed; refetch GET /api/finance/etims/submissions and in-app notifications.'
    sales:quote: 'SalesQuote changed; refetch GET /api/sales/quotes.'
    sales:order: 'SalesOrder confirmed or converted; refetch GET /api/sales/orders.'
    sales:delivery: 'DeliveryNote issued; refetch GET /api/sales/deliveries.'
    sales:return: 'SalesReturn approved; refetch GET /api/sales/returns.'
    sales:invoice: 'Invoice created from a sales order; refetch /api/sales/orders and /api/finance/invoices.'
  eventPayload:
    eventId: string
    type: string
    occurredAt: string (date-time)
    correlationId: string
    data: IDs and classification only; no body or subject.
  fallback: Authenticated polling of /api/messaging/threads and messages when sockets are unavailable.
  phase5EventMap:
    FileUploaded: file:new
    FileScanned: file:scanned
    NotificationCreated: notification:new
    NotificationRead: notification:read
    WorkflowInstanceStarted: workflow:started
    WorkflowTaskAssigned: workflow:task
    WorkflowCompleted: workflow:completed
    DocumentGenerated: document:generated
    DocumentIssued: document:issued
    SearchIndexUpdated: 'none (index maintenance only; no socket frame)'
  phase5Rooms:
    - company:{companyId} (file and document events, workflow completion)
    - company:{companyId}:user:{userId} (notification, workflow task, uploader/creator events)
  phase5Fallback: |
    Authenticated polling of /api/notifications, /api/workflow/tasks, /api/files and
    /api/documents when sockets are unavailable. Socket frames carry IDs only; clients
    always refetch through the authenticated API.
  phase6EventMap:
    FinanceAccountCreated: finance:account
    FinanceAccountUpdated: finance:account
    FinancePartyCreated: 'none (parties reloaded with the finance view)'
    StatutoryRateCreated: finance:rate
    StatutoryRateVerified: finance:rate
    FinanceJournalCreated: finance:journal
    FinanceJournalPosted: finance:journal
    FinanceJournalReversed: finance:journal
    FinanceInvoiceCreated: finance:invoice
    FinanceInvoiceIssued: finance:invoice
    FinancePaymentRecorded: finance:payment
    FinanceBudgetCreated: finance:budget
    FinanceBudgetApproved: finance:budget
    EtimsSubmissionQueued: finance:etims
    EtimsSubmissionFailed: finance:etims-failed
  phase6PayloadRule: |
    Every finance socket frame carries only IDs and classification. No amount, status
    text, tax PIN, card data, payload or eTIMS provider response is placed on a socket;
    clients always refetch through the authenticated /api/finance endpoints.
  phase6EtimsNote: |
    finance.etims and finance:etims-failed report an internal ready-only queue. The
    finance.etims.submit worker records PENDING for a certified provider and creates
    in-app notifications only. No event or endpoint claims live filing to KRA.
  phase6Fallback: |
    Authenticated polling of /api/finance accounts, rates, parties, invoices, payments,
    budgets and eTIMS submissions when sockets are unavailable. As with Phase 5, event
    data is never rendered directly.
  phase7EventMap:
    SalesQuoteCreated: sales:quote
    SalesOrderConfirmed: sales:order
    DeliveryNoteIssued: sales:delivery
    SalesReturnApproved: sales:return
    SalesInvoiceCreated: sales:invoice
  phase7Rooms:
    - company:{companyId} only (never user, thread, inbox or branch rooms)
  phase7PayloadRule: |
    Sales socket frames and domain events carry IDs and classification only. No document
    number, amount, status text, customer name or free text is placed on an event; clients
    always refetch through the authenticated /api/sales endpoints.
  phase7Fallback: |
    Authenticated polling of /api/sales quotes, orders, deliveries and returns when sockets
    are unavailable. Event data is never rendered directly.
x-idempotency:
  requiredFor:
    - POST /api/messaging/threads/{id}/messages
  phase5: |
    Not required. No Phase 5 endpoint consumes an Idempotency-Key, and retries of
    Phase 5 writes are not de-duplicated by the server.
  phase6: |
    Not required. Idempotency-Key remains scoped to messaging sends only. No
    /api/finance endpoint consumes it, and finance writes are not replay-safe.
  phase7: |
    Not required. No /api/sales endpoint consumes an Idempotency-Key. Quote/order/delivery
    transitions and invoice creation are not replay-safe; clients must inspect the returned
    status before retrying.
x-finance:
  money: All finance API monetary fields are integer cents (`*Cents`); reports use the same unit. The eTIMS payload is a separate external-style representation using decimal strings and is not a finance money field.
  rates: |
    `rateBps` is integer basis points and comes only from the versioned statutory-rate
    table. Only VERIFIED, effective rows may be used for finance calculations and invoice
    issuance. Rates are never hardcoded. The legacy storefront `taxRate` remains outside
    this table and is not used by Phase 6 finance calculations.
  sensitiveData: |
    No plaintext tax PIN or card data is stored or emitted. Party PINs are encrypted at rest
    and only `hasTaxPin`/`taxPinMasked` are exposed. `CARD_TOKEN` is a method identifier;
    PAN, card number and CVV are not accepted fields.
  etims: |
    Ready-only internal queue on `finance.etims.submit`. PENDING records for a certified
    provider plus in-app notifications only. NOT live filing and never a submission to KRA.
  permissions:
    - finance.account.read
    - finance.account.write
    - finance.journal.read
    - finance.journal.write
    - finance.journal.post
    - finance.party.read
    - finance.party.write
    - finance.invoice.read
    - finance.invoice.write
    - finance.invoice.issue
    - finance.payment.read
    - finance.payment.write
    - finance.budget.read
    - finance.budget.write
    - finance.statutory.read
    - finance.statutory.write
    - finance.statutory.verify
    - finance.statement.read
    - finance.etims.read
    - finance.etims.write
  socketEvents:
    - finance:account
    - finance:journal
    - finance:invoice
    - finance:payment
    - finance:budget
    - finance:rate
    - finance:etims
    - finance:etims-failed
  idempotency: Idempotency-Key is scoped to messaging sends only; finance writes are not replay-safe.
x-sales:
  money: All sales document monetary fields are integer cents (`*Cents`). Tax is never calculated or stored as a rate value in sales rows; finance applies a VERIFIED rate when an invoice is issued.
  dates: All document dates are strict ISO `YYYY-MM-DD` strings.
  rateReferences: |
    `taxRateId` is an intended statutory VAT reference only. It must identify a VAT rate in the
    caller's tenant, but an UNVERIFIED rate may be stored on a draft document. Invoice creation
    resolves the rate through finance's VERIFIED guard; an omitted `taxRateId` is allowed and
    finance rejects issue when no effective verified rate exists. No rate value is hardcoded.
  tenantScope: companyId is derived from the bearer token; a client-supplied companyId is rejected by strict request schemas. Branch scope allows organisation-wide (null branch) rows.
  dlp: Free text is inspected with the shared DLP patterns and fails closed; restricted findings are rejected with 422 and reported by type only.
  eventPayload: IDs and classification only; company-room sockets are invalidation signals.
  permissions:
    - sales.quote.read
    - sales.quote.write
    - sales.order.read
    - sales.order.write
    - sales.order.confirm
    - sales.delivery.read
    - sales.delivery.write
    - sales.delivery.issue
    - sales.return.read
    - sales.return.write
    - sales.return.approve
    - sales.invoice.create
  socketEvents:
    - sales:quote
    - sales:order
    - sales:delivery
    - sales:return
    - sales:invoice
  statusTransitions:
    quote: 'DRAFT -> SENT/ACCEPTED/CONVERTED/CANCELLED; SENT -> ACCEPTED/REJECTED/EXPIRED/CONVERTED/CANCELLED; ACCEPTED -> CONVERTED'
    order: 'DRAFT -> CONFIRMED/CANCELLED; CONFIRMED -> FULFILLED'
    delivery: 'DRAFT -> ISSUED/CANCELLED; ISSUED -> IN_TRANSIT/DELIVERED; IN_TRANSIT -> DELIVERED'
    return: 'DRAFT -> APPROVED/REJECTED/CANCELLED; APPROVED -> RECEIVED/REJECTED'
  idempotency: Idempotency-Key is scoped to messaging sends only; sales writes are not replay-safe.
paths:
  /api/health/live:
    get:
      tags:
        - Health
      summary: Liveness probe
      description: Returns 200 if the process is running. Does not check dependencies.
      operationId: getHealthLive
      security: []
      responses:
        '200':
          description: Process is alive.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/health/ready:
    get:
      tags:
        - Health
      summary: Readiness probe
      description: Checks PostgreSQL, Redis, and object storage availability.
      operationId: getHealthReady
      security: []
      responses:
        '200':
          description: All required dependencies are reachable.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: One or more dependencies are unavailable.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/auth/register:
    post:
      tags:
        - Identity
      summary: Create a storefront account (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
                phone: { type: string }
                company: { type: string }
      responses:
        '201':
          description: Account created; returns an access token and refresh cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        '400':
          description: Password policy violation.
        '409':
          description: Email already registered in this tenant.
  /api/auth/login:
    post:
      tags:
        - Identity
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Signed in, or MFA challenge issued when MFA is enabled.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SignInResponse'
                  - $ref: '#/components/schemas/MfaChallengeResponse'
        '401':
          description: Invalid credentials.
        '423':
          description: Account temporarily locked after repeated failures.
  /api/auth/mfa/verify:
    post:
      tags:
        - Identity
      summary: Complete an MFA challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              properties:
                challenge: { type: string }
                code: { type: string, description: TOTP code or unused recovery code }
      responses:
        '200':
          description: Signed in; access token and refresh cookie returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        '401':
          description: Invalid code.
  /api/auth/mfa/enrol:
    post:
      tags:
        - Identity
      summary: Begin TOTP enrolment
      responses:
        '200':
          description: Secret, otpauth URI, and one-time recovery codes.
  /api/auth/mfa/confirm:
    post:
      tags:
        - Identity
      summary: Confirm TOTP enrolment with a valid code
      responses:
        '200':
          description: MFA enabled.
  /api/auth/me:
    get:
      tags:
        - Identity
      summary: Current user and roles
      responses:
        '200':
          description: Current principal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  roles: { type: array, items: { type: string } }
                  sessionId: { type: string }
  /api/auth/refresh:
    post:
      tags:
        - Identity
      summary: Rotate the refresh cookie and issue a new access token
      security:
        - cookieAuth: []
      responses:
        '200':
          description: New access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        '401':
          description: Refresh token invalid, reused, or expired.
  /api/auth/logout:
    post:
      tags:
        - Identity
      summary: Revoke the current session
      responses:
        '200':
          description: Signed out.
  /api/auth/sessions:
    get:
      tags:
        - Identity
      summary: List active sessions for the current user
      responses:
        '200':
          description: Active sessions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
  /api/auth/sessions/{id}/revoke:
    post:
      tags:
        - Identity
      summary: Revoke one of the current user's sessions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Session revoked.
        '404':
          description: Session not found.
  /api/auth/sessions/revoke-others:
    post:
      tags:
        - Identity
      summary: Revoke all other sessions for the current user
      responses:
        '200':
          description: Other sessions revoked.
  /api/auth/change-password:
    post:
      tags:
        - Identity
      summary: Change password (revokes all sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 12 }
      responses:
        '200':
          description: Password changed; sign in again.
  /api/auth/forgot-password:
    post:
      tags:
        - Identity
      summary: Send a password reset link to an external email address
      security: []
      responses:
        '200':
          description: Always returned, whether or not the account exists.
  /api/auth/reset-password:
    post:
      tags:
        - Identity
      summary: Set a new password using a reset token
      security: []
      responses:
        '200':
          description: Password updated.
        '400':
          description: Invalid or expired token, or policy violation.
  /api/auth/oidc/start:
    get:
      tags:
        - Identity
      summary: Begin the OIDC authorization-code flow
      responses:
        '302':
          description: Redirect to the configured identity provider.
        '503':
          description: No OIDC provider configured.
  /api/auth/oidc/callback:
    post:
      tags:
        - Identity
      summary: Exchange an OIDC code and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        '502':
          description: Provider verification failed.
  /api/identity/users:
    get:
      tags:
        - Identity
      summary: List users in the current tenant
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: User directory.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
    post:
      tags:
        - Identity
      summary: Invite a user
      responses:
        '201':
          description: Invited; external email contains a one-time setup link.
        '409':
          description: Email already exists in this tenant.
  /api/identity/users/{id}:
    get:
      tags:
        - Identity
      summary: Get a user
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User and assigned roles.
  /api/identity/users/{id}/disable:
    post:
      tags:
        - Identity
      summary: Disable a user and revoke all sessions
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User disabled.
  /api/identity/users/{id}/roles:
    post:
      tags:
        - Identity
      summary: Assign an access role
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '201':
          description: Role assigned.
  /api/identity/roles:
    get:
      tags:
        - Identity
      summary: List roles and their permissions
      responses:
        '200':
          description: Role catalogue.
  /api/identity/permissions:
    get:
      tags:
        - Identity
      summary: List permissions
      responses:
        '200':
          description: Permission catalogue.
  /api/org/branches:
    get:
      tags:
        - Organisation
      summary: List branches
      responses:
        '200':
          description: Branches in the current tenant.
    post:
      tags:
        - Organisation
      summary: Create a branch
      responses:
        '201':
          description: Branch created.
  /api/org/departments:
    get:
      tags:
        - Organisation
      summary: List departments
      responses:
        '200':
          description: Departments in the current tenant.
    post:
      tags:
        - Organisation
      summary: Create a department
      responses:
        '201':
          description: Department created.
  /api/audit/logs:
    get:
      tags:
        - Audit
      summary: Query the append-only audit log
      parameters:
        - name: action
          in: query
          schema: { type: string }
        - name: actorId
          in: query
          schema: { type: string }
        - name: resourceType
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching audit entries.
  /api/audit/verify:
    get:
      tags:
        - Audit
      summary: Verify the SHA-256 audit hash chain
      responses:
        '200':
          description: Verification result.
  /api/messaging/inboxes:
    get:
      tags: [Messaging]
      summary: List inboxes visible to the principal
      responses:
        '200':
          description: Visible inboxes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  inboxes:
                    type: array
                    items: { $ref: '#/components/schemas/Inbox' }
    post:
      tags: [Messaging]
      summary: Create an inbox
      responses:
        '201':
          description: Inbox created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  inbox: { $ref: '#/components/schemas/Inbox' }
  /api/messaging/inboxes/{id}/members:
    get:
      tags: [Messaging]
      summary: List inbox memberships
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Memberships for the inbox.
  /api/messaging/threads:
    get:
      tags: [Messaging]
      summary: List threads visible to the principal
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, PENDING, RESOLVED, CLOSED] }
        - name: inboxId
          in: query
          schema: { type: string }
        - name: channelId
          in: query
          schema: { type: string }
        - name: assignedToId
          in: query
          schema: { type: string }
        - name: archived
          in: query
          schema: { type: string, enum: ['true', 'false'] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Matching threads.
          content:
            application/json:
              schema:
                type: object
                properties:
                  threads:
                    type: array
                    items: { $ref: '#/components/schemas/Thread' }
    post:
      tags: [Messaging]
      summary: Create a thread with internal recipients
      description: 'Recipients may be user IDs, inbox codes/addresses, or department:/role:/branch: aliases.'
      responses:
        '201':
          description: Thread created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  thread: { $ref: '#/components/schemas/Thread' }
        '400':
          description: Invalid payload, including an external-looking email address.
        '422':
          description: A recipient could not be resolved to an internal user or inbox.
  /api/messaging/threads/{id}:
    get:
      tags: [Messaging]
      summary: Read a thread and the caller's access level
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Thread detail, including `canSeeInternal`.
        '404':
          description: Thread not found or not accessible.
    patch:
      tags: [Messaging]
      summary: Update status, priority, dates or archive state
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Updated thread.
  /api/messaging/threads/{id}/assign:
    post:
      tags: [Messaging]
      summary: Assign or unassign a shared-inbox thread
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Thread with the new assignee.
        '403':
          description: Caller cannot manage this shared inbox.
  /api/messaging/threads/{id}/resolve:
    post:
      tags: [Messaging]
      summary: Mark a thread RESOLVED
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Updated thread.
  /api/messaging/threads/{id}/messages:
    get:
      tags: [Messaging]
      summary: List messages in a thread
      description: INTERNAL notes are omitted for principals without inbox manager access.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          schema: { type: string }
        - name: after
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Visible messages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
    post:
      tags: [Messaging]
      summary: Send a message or internal note
      description: Requires an Idempotency-Key. DLP findings block the write by default.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Message created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/Message' }
                  replay: { type: boolean, enum: [false] }
                  dlpTypes: { type: array, items: { type: string } }
        '200':
          description: Idempotent replay of an existing message; nothing was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/Message' }
                  replay: { type: boolean, enum: [true] }
        '400':
          description: Missing Idempotency-Key.
        '422':
          description: DLP violation or unresolved recipient.
  /api/messaging/messages/{id}/recall:
    post:
      tags: [Messaging]
      summary: Recall a message
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Recalled message.
  /api/messaging/messages/{id}/edit:
    post:
      tags: [Messaging]
      summary: Edit a message and retain the previous body in an edit record
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Edited message.
  /api/messaging/messages/{id}/reactions:
    post:
      tags: [Messaging]
      summary: Add a reaction
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '201':
          description: Reaction added.
        '200':
          description: Reaction already existed.
  /api/messaging/messages/{id}/reactions/{emoji}:
    delete:
      tags: [Messaging]
      summary: Remove the caller's reaction
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: emoji
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Removal result.
  /api/messaging/messages/{id}/read:
    post:
      tags: [Messaging]
      summary: Record a read receipt
      description: INTERNAL notes never produce receipts.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Whether a receipt was recorded.
  /api/messaging/channels:
    get:
      tags: [Messaging]
      summary: List channels visible to the principal
      responses:
        '200':
          description: Visible channels.
    post:
      tags: [Messaging]
      summary: Create a channel
      responses:
        '201':
          description: Channel created; creator becomes OWNER.
  /api/messaging/channels/{id}/join:
    post:
      tags: [Messaging]
      summary: Join a public channel
      description: Private channels require an invitation and return 403.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Join result.
  /api/messaging/routing/evaluate:
    post:
      tags: [Messaging]
      summary: Evaluate routing rules without creating a thread
      responses:
        '200':
          description: Matching rule or null.
  /api/messaging/realtime-token:
    get:
      tags: [Messaging]
      summary: Issue a short-lived Socket.IO token with an explicit room allow-list
      responses:
        '200':
          description: Realtime token and rooms.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  rooms:
                    type: array
                    items: { type: string }
  /api/files/uploads:
    post:
      tags: [Platform]
      summary: Request a file upload ticket and create a PENDING file object
      description: |
        Returns a short-lived ticket. With R2 configured the client PUTs the bytes
        directly to the absolute signed `upload.url`. Otherwise the encrypted local
        fallback returns `provider=LOCAL`, `method=POST` and a relative ticket URL
        under `/api/files/local-upload/`. Confirm the upload after transferring bytes.
        `Idempotency-Key` is not required.
      operationId: requestFileUpload
      x-permission: files.object.write
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '201':
          description: File record and upload ticket.
          content:
            application/json:
              schema:
                type: object
                required: [file, upload]
                properties:
                  file: { $ref: '#/components/schemas/FileDto' }
                  upload: { $ref: '#/components/schemas/UploadTicket' }
        '400':
          description: Invalid payload, disallowed MIME type, or declared size above the upload limit.
  /api/files/uploads/{id}/confirm:
    post:
      tags: [Platform]
      summary: Confirm a completed upload and enqueue a file scan
      description: |
        Verifies the stored size and optional SHA-256 checksum in local mode, moves
        the file out of `PENDING`, and enqueues `files.scan`. Poll `GET /api/files/{id}`
        for the resulting `CLEAN`, `INFECTED` or `QUARANTINED` status.
      operationId: confirmFileUpload
      x-permission: files.object.write
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileConfirmRequest'
      responses:
        '200':
          description: Confirmed file.
          content:
            application/json:
              schema:
                type: object
                required: [file]
                properties:
                  file: { $ref: '#/components/schemas/FileDto' }
        '403':
          description: Caller is not the uploader or an administrator.
        '409':
          description: Upload was already confirmed.
        '422':
          description: Uploaded size or checksum does not match the request.
  /api/files:
    get:
      tags: [Platform]
      summary: List file objects visible to the principal
      description: Returns the caller's and same-branch files; administrators and compliance see all tenant files.
      operationId: listFiles
      x-permission: files.object.read
      security:
        - bearerAuth: []
      parameters:
        - name: purpose
          in: query
          schema: { type: string, maxLength: 40 }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, CLEAN, INFECTED, QUARANTINED] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Matching file DTOs.
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items: { $ref: '#/components/schemas/FileDto' }
  /api/files/{id}:
    get:
      tags: [Platform]
      summary: Get a file object by ID
      operationId: getFile
      x-permission: files.object.read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: File DTO.
          content:
            application/json:
              schema:
                type: object
                required: [file]
                properties:
                  file: { $ref: '#/components/schemas/FileDto' }
        '403':
          description: Caller cannot access this file or branch.
        '404':
          description: File not found.
    delete:
      tags: [Platform]
      summary: Soft-delete a file and best-effort remove its object
      operationId: deleteFile
      x-permission: files.object.delete
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Soft-deleted file. Object cleanup failures are logged, not returned.
          content:
            application/json:
              schema:
                type: object
                required: [file]
                properties:
                  file: { $ref: '#/components/schemas/FileDto' }
        '403':
          description: Caller is not the uploader or an administrator.
        '404':
          description: File not found.
  /api/files/{id}/download:
    get:
      tags: [Platform]
      summary: Issue a short-lived download ticket
      operationId: getFileDownload
      x-permission: files.object.read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Download ticket. `url` is repeated at the top level for existing clients.
          content:
            application/json:
              schema:
                type: object
                required: [download, url]
                properties:
                  download: { $ref: '#/components/schemas/DownloadTicket' }
                  url: { type: string, format: uri-reference }
        '403':
          description: Caller cannot access this file.
        '404':
          description: File not found.
  /api/files/{id}/versions:
    post:
      tags: [Platform]
      summary: Create a new version of a file object
      description: Increments `version`, resets `status` to PENDING, and returns a fresh upload ticket.
      operationId: createFileVersion
      x-permission: files.object.write
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '201':
          description: New file version and upload ticket.
          content:
            application/json:
              schema:
                type: object
                required: [file, upload]
                properties:
                  file: { $ref: '#/components/schemas/FileDto' }
                  upload: { $ref: '#/components/schemas/UploadTicket' }
        '403':
          description: Caller is not the uploader or an administrator.
        '404':
          description: File not found.
  /api/files/local-upload/{token}:
    post:
      tags: [Platform]
      summary: Write bytes for a local encrypted upload ticket
      description: |
        Internal capability URL returned when `upload.provider=LOCAL`. The signed
        token in the path identifies the object key and expiry; an authenticated
        bearer token is optional but, when present, must match the uploader/tenant.
        Body is the raw file bytes, not JSON. Not used when R2 is configured.
      operationId: localFileUpload
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Stored file DTO.
          content:
            application/json:
              schema:
                type: object
                required: [file]
                properties:
                  file: { $ref: '#/components/schemas/FileDto' }
        '400':
          description: Invalid or expired ticket, or empty body.
        '403':
          description: Bearer principal does not own the object.
        '409':
          description: Upload already confirmed.
        '413':
          description: Body exceeds `MAX_UPLOAD_BYTES`.
        '415':
          description: MIME mismatch or disallowed file type.
  /api/files/local-download/{token}:
    get:
      tags: [Platform]
      summary: Read bytes for a local encrypted download ticket
      description: Internal capability URL returned by `GET /api/files/{id}/download` when `provider=LOCAL`.
      operationId: localFileDownload
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Raw file bytes with a sanitised `Content-Disposition` and `Cache-Control: no-store`.'
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          description: Invalid or expired ticket.
        '401':
          description: Authentication required.
        '403':
          description: Caller cannot access the file.
        '404':
          description: File not found.
  /api/workflow/definitions:
    get:
      tags: [Platform]
      summary: List workflow definitions for the tenant
      operationId: listWorkflowDefinitions
      x-permission: workflow.definition.read
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Definitions ordered by code and version.
          content:
            application/json:
              schema:
                type: object
                required: [definitions]
                properties:
                  definitions:
                    type: array
                    items: { $ref: '#/components/schemas/WorkflowDefinition' }
    post:
      tags: [Platform]
      summary: Create a new version of a workflow definition
      description: Steps are ordered and resolved at instance start; the version number is server-assigned.
      operationId: createWorkflowDefinition
      x-permission: workflow.definition.write
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowDefinitionRequest'
      responses:
        '201':
          description: Created definition.
          content:
            application/json:
              schema:
                type: object
                required: [definition]
                properties:
                  definition: { $ref: '#/components/schemas/WorkflowDefinition' }
        '400':
          description: Invalid step list or definition payload.
  /api/workflow/instances:
    get:
      tags: [Platform]
      summary: List workflow instances visible to the principal
      description: Rows outside the caller's branch scope are filtered out rather than rejected.
      operationId: listWorkflowInstances
      x-permission: workflow.instance.read
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [RUNNING, COMPLETED, REJECTED] }
        - name: entityType
          in: query
          schema: { type: string, maxLength: 40 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Matching instances with their tasks.
          content:
            application/json:
              schema:
                type: object
                required: [instances]
                properties:
                  instances:
                    type: array
                    items: { $ref: '#/components/schemas/WorkflowInstance' }
    post:
      tags: [Platform]
      summary: Start a workflow instance from an active definition
      description: |
        Resolves assignees for the first step and creates one PENDING task per
        assignee. Emits `WorkflowInstanceStarted` and `WorkflowTaskAssigned` with
        ID-only payloads.
      operationId: startWorkflowInstance
      x-permission: workflow.definition.read
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowStartRequest'
      responses:
        '201':
          description: Started instance and initial tasks.
          content:
            application/json:
              schema:
                type: object
                required: [instance, tasks]
                properties:
                  instance: { $ref: '#/components/schemas/WorkflowInstance' }
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/WorkflowTask' }
        '403':
          description: Caller cannot access the requested branch.
        '404':
          description: No active definition with that code.
        '422':
          description: Definition has no first step or no assignee can be resolved.
  /api/workflow/tasks:
    get:
      tags: [Platform]
      summary: List workflow tasks
      description: Assignees and delegates see their own tasks; administrators see all unless `mine=1` is set.
      operationId: listWorkflowTasks
      x-permission: workflow.task.approve
      security:
        - bearerAuth: []
      parameters:
        - name: mine
          in: query
          description: Accepts `1` or `true` to restrict the list to the caller.
          schema: { type: string, enum: ['1', 'true', '0', 'false'] }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED, DELEGATED] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Matching tasks with their instances.
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/WorkflowTask' }
  /api/workflow/tasks/{id}/decide:
    post:
      tags: [Platform]
      summary: Approve or reject a workflow task
      description: |
        Approval advances to the next step or completes the instance; rejection
        cancels outstanding tasks. Creates a generic in-app notice for the requester
        and emits `WorkflowTaskAssigned` / `WorkflowCompleted` ID-only events.
      operationId: decideWorkflowTask
      x-permission: workflow.task.approve
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTaskDecisionRequest'
      responses:
        '200':
          description: Actioned task, resulting instance and any newly assigned tasks.
          content:
            application/json:
              schema:
                type: object
                required: [task, instance]
                properties:
                  task: { $ref: '#/components/schemas/WorkflowTask' }
                  instance: { $ref: '#/components/schemas/WorkflowInstance' }
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/WorkflowTask' }
        '403':
          description: Caller is neither the assignee nor an administrator.
        '404':
          description: Task not found or not visible to the caller.
        '409':
          description: Task has already been actioned.
        '422':
          description: No assignee can be resolved for the next step.
  /api/workflow/tasks/{id}/delegate:
    post:
      tags: [Platform]
      summary: Delegate a pending task to another active tenant user
      operationId: delegateWorkflowTask
      x-permission: workflow.task.delegate
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowDelegateRequest'
      responses:
        '200':
          description: Original task marked DELEGATED and the replacement PENDING task.
          content:
            application/json:
              schema:
                type: object
                required: [task, delegatedTask]
                properties:
                  task: { $ref: '#/components/schemas/WorkflowTask' }
                  delegatedTask: { $ref: '#/components/schemas/WorkflowTask' }
        '403':
          description: Caller is neither the assignee nor an administrator.
        '404':
          description: Task or delegatee not found.
        '409':
          description: Only pending tasks can be delegated.
        '422':
          description: Delegatee is the current assignee.
  /api/notifications:
    get:
      tags: [Platform]
      summary: List the caller's in-app notifications
      description: Expired notifications are excluded. Titles and messages are only available from this authenticated endpoint.
      operationId: listNotifications
      x-permission: notifications.read
      security:
        - bearerAuth: []
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: string, enum: ['true', 'false'] }
        - name: category
          in: query
          schema: { type: string, enum: [MESSAGE, WORKFLOW, DOCUMENT, FILE, SYSTEM] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Notifications for the current user.
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications:
                    type: array
                    items: { $ref: '#/components/schemas/NotificationDto' }
  /api/notifications/preferences:
    get:
      tags: [Platform]
      summary: Get the caller's in-app notification preference
      operationId: getNotificationPreferences
      x-permission: notifications.manage
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Preference (defaults to IN_APP enabled with no digest).
          content:
            application/json:
              schema:
                type: object
                required: [preferences]
                properties:
                  preferences: { $ref: '#/components/schemas/NotificationPreference' }
    put:
      tags: [Platform]
      summary: Update or create the caller's in-app notification preference
      description: Only the `IN_APP` channel exists; disabling it suppresses new notifications entirely.
      operationId: updateNotificationPreferences
      x-permission: notifications.manage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreference'
      responses:
        '200':
          description: Saved preference.
          content:
            application/json:
              schema:
                type: object
                required: [preferences]
                properties:
                  preferences: { $ref: '#/components/schemas/NotificationPreference' }
        '400':
          description: Invalid channel or digest value.
  /api/notifications/{id}/read:
    post:
      tags: [Platform]
      summary: Mark one notification read
      description: Ownership is enforced in the lookup, so another user's ID returns 404.
      operationId: markNotificationRead
      x-permission: notifications.read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Notification with `readAt` set.
          content:
            application/json:
              schema:
                type: object
                required: [notification]
                properties:
                  notification: { $ref: '#/components/schemas/NotificationDto' }
        '404':
          description: Notification not found for this user.
  /api/notifications/read-all:
    post:
      tags: [Platform]
      summary: Mark all of the caller's unread notifications read
      operationId: markAllNotificationsRead
      x-permission: notifications.read
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Number of notifications changed.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer, minimum: 0 }
  /api/search:
    get:
      tags: [Platform]
      summary: Permission-aware full-text search
      description: |
        PostgreSQL full-text search over tenant-scoped `SearchDocument` projections.
        Results are filtered by classification, branch scope and per-document user/role
        allow lists. `types` accepts repeated values or a comma-separated string.
        The raw query text is never audited.
      operationId: searchPlatform
      x-permission: search.read
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: types
          in: query
          description: Optional entity types; repeated or comma-separated.
          schema:
            type: array
            items: { type: string, enum: [MESSAGE, THREAD, DOCUMENT, FILE, WORKFLOW, USER] }
          style: form
          explode: true
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Visible results and total matching count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Missing or invalid query.
  /api/documents/kinds:
    get:
      tags: [Platform]
      summary: List supported business document kinds
      operationId: listDocumentKinds
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Kind metadata for generation forms.
          content:
            application/json:
              schema:
                type: object
                required: [kinds]
                properties:
                  kinds:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentKind' }
  /api/documents:
    get:
      tags: [Platform]
      summary: List business documents visible to the caller
      description: Non-admins see documents matching their email; administrators may pass `all=1`.
      operationId: listDocuments
      x-permission: documents.read
      security:
        - bearerAuth: []
      parameters:
        - name: all
          in: query
          description: Administrator-only flag to include all tenant documents.
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: Matching documents.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BusinessDocument' }
  /api/documents/generate:
    post:
      tags: [Platform]
      summary: Queue business document generation
      description: |
        Returns immediately with a BullMQ job ID. Poll `GET /api/documents/jobs/{id}`
        until the job completes, then use `GET /api/documents/{code}/download`.
        Only the document kind is audited; client contact details are not.
        `Idempotency-Key` is not required, so do not blindly retry this write.
      operationId: generateDocument
      x-permission: documents.write
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentGenerateRequest'
      responses:
        '202':
          description: Generation queued.
          content:
            application/json:
              schema:
                type: object
                required: [jobId, status]
                properties:
                  jobId: { type: string, nullable: true }
                  status: { type: string, enum: [QUEUED] }
        '400':
          description: Invalid payload or kind-specific fields missing.
  /api/documents/jobs/{id}:
    get:
      tags: [Platform]
      summary: Get the state of a document generation job
      description: Returns 404 when the job ID is unknown or has been removed by BullMQ retention.
      operationId: getDocumentJob
      x-permission: documents.read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job status.
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/DocumentJobStatus' }
        '404':
          description: Job not found.
  /api/documents/{code}/download:
    get:
      tags: [Platform]
      summary: Issue a short-lived download ticket for a generated PDF
      operationId: downloadGeneratedDocument
      x-permission: documents.read
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          description: Business document number, for example `QUO-2026-0001`.
          schema: { type: string }
      responses:
        '200':
          description: Download ticket and safe file name.
          content:
            application/json:
              schema:
                type: object
                required: [download, url, fileName]
                properties:
                  download: { $ref: '#/components/schemas/DownloadTicket' }
                  url: { type: string, format: uri-reference }
                  fileName: { type: string }
        '403':
          description: Caller cannot view this document.
        '404':
          description: Document not found.
        '409':
          description: Generation is still queued or in progress.
  /api/documents/{code}:
    get:
      tags: [Platform]
      summary: Get business document metadata
      operationId: getDocument
      x-permission: documents.read
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Document metadata.
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: '#/components/schemas/BusinessDocument' }
        '403':
          description: Caller cannot view this document.
        '404':
          description: Document not found.
  /api/documents/{code}/pdf:
    get:
      tags: [Platform]
      summary: Render the branded PDF inline
      description: Draft documents are visible to administrators only; issued documents render for permitted viewers.
      operationId: renderDocumentPdf
      x-permission: documents.read
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'PDF bytes with `Content-Disposition: inline` and `Cache-Control: no-store`.'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403':
          description: Document is a draft or caller cannot view it.
        '404':
          description: Document not found.
  /api/finance/accounts:
    get:
      tags: [Finance]
      summary: List the chart of accounts
      description: Tenant/branch scoped. Accepts either `{ accounts }` or a bare array in non-conforming deployments.
      operationId: listFinanceAccounts
      x-permission: finance.account.read
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE] }
        - name: active
          in: query
          schema: { type: string, enum: ['true', 'false'] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Accounts visible to the caller.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: '#/components/schemas/FinanceAccount' }
        '400': { description: Invalid query parameter. }
        '403': { description: Missing finance.account.read permission. }
    post:
      tags: [Finance]
      summary: Create a chart of accounts entry
      operationId: createFinanceAccount
      x-permission: finance.account.write
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceAccountCreateRequest'
      responses:
        '201':
          description: Created account.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account: { $ref: '#/components/schemas/FinanceAccount' }
        '400': { description: Invalid account payload. }
        '403': { description: Missing finance.account.write permission. }
        '409': { description: Account code or systemCode already exists in this tenant. }
  /api/finance/parties:
    get:
      tags: [Finance]
      summary: List customers and suppliers
      description: Returns `hasTaxPin` and `taxPinMasked` only. Plaintext PINs are never stored or emitted.
      operationId: listFinanceParties
      x-permission: finance.party.read
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [CUSTOMER, SUPPLIER] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Parties visible to the caller.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [parties]
                properties:
                  parties:
                    type: array
                    items: { $ref: '#/components/schemas/FinanceParty' }
        '403': { description: Missing finance.party.read permission. }
    post:
      tags: [Finance]
      summary: Create a customer or supplier
      description: A supplied PIN is encrypted at rest; only a masked reference is returned. Card numbers and CVV are not accepted fields.
      operationId: createFinanceParty
      x-permission: finance.party.write
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancePartyCreateRequest'
      responses:
        '201':
          description: Created party.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [party]
                properties:
                  party: { $ref: '#/components/schemas/FinanceParty' }
        '400': { description: Invalid party payload. }
        '403': { description: Missing finance.party.write permission. }
  /api/finance/statutory-rates:
    get:
      tags: [Finance]
      summary: List versioned statutory rates
      description: Filter by `activeOn` to find the rate effective on a date. Fixture rows are UNVERIFIED until signed off.
      operationId: listStatutoryRates
      x-permission: finance.statutory.read
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [VAT] }
        - name: activeOn
          in: query
          description: ISO date (`YYYY-MM-DD`) within the rate's effective interval.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Statutory rate rows.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [rates]
                properties:
                  rates:
                    type: array
                    items: { $ref: '#/components/schemas/StatutoryRate' }
        '403': { description: Missing finance.statutory.read permission. }
    post:
      tags: [Finance]
      summary: Propose a statutory rate
      description: Creates an UNVERIFIED row with a source reference. It cannot be used for finance calculations until verified.
      operationId: createStatutoryRate
      x-permission: finance.statutory.write
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatutoryRateCreateRequest'
      responses:
        '201':
          description: Created UNVERIFIED rate.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [rate]
                properties:
                  rate: { $ref: '#/components/schemas/StatutoryRate' }
        '400': { description: Invalid rate payload or missing sourceReference. }
        '403': { description: Missing finance.statutory.write permission. }
        '409': { description: A row with this code and effectiveFrom already exists. }
  /api/finance/statutory-rates/{id}/verify:
    post:
      tags: [Finance]
      summary: Sign off a statutory rate
      description: Moves a row from UNVERIFIED to VERIFIED with a named reviewer and note. Finance clients never auto-verify rates.
      operationId: verifyStatutoryRate
      x-permission: finance.statutory.verify
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatutoryRateVerifyRequest'
      responses:
        '200':
          description: Verified rate.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [rate]
                properties:
                  rate: { $ref: '#/components/schemas/StatutoryRate' }
        '400': { description: Missing verifiedBy or verificationNote. }
        '403': { description: Missing finance.statutory.verify permission. }
        '404': { description: Rate not found. }
        '409': { description: Rate is already VERIFIED or SUPERSEDED. }
  /api/finance/journals:
    get:
      tags: [Finance]
      summary: List double-entry journals
      operationId: listFinanceJournals
      x-permission: finance.journal.read
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, POSTED, REVERSED] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Journals visible to the caller.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [journals]
                properties:
                  journals:
                    type: array
                    items: { $ref: '#/components/schemas/FinanceJournal' }
        '403': { description: Missing finance.journal.read permission. }
    post:
      tags: [Finance]
      summary: Create a draft journal
      description: Debit and credit totals must balance in integer cents before a journal can be posted.
      operationId: createFinanceJournal
      x-permission: finance.journal.write
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceJournalCreateRequest'
      responses:
        '201':
          description: Created draft journal.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [journal]
                properties:
                  journal: { $ref: '#/components/schemas/FinanceJournal' }
        '400': { description: Invalid lines or unbalanced journal. }
        '403': { description: Missing finance.journal.write permission. }
  /api/finance/journals/{id}:
    get:
      tags: [Finance]
      summary: Get a journal with its lines
      operationId: getFinanceJournal
      x-permission: finance.journal.read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Journal detail.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [journal]
                properties:
                  journal: { $ref: '#/components/schemas/FinanceJournal' }
        '403': { description: Missing finance.journal.read permission. }
        '404': { description: Journal not found. }
  /api/finance/journals/{id}/post:
    post:
      tags: [Finance]
      summary: Post a draft journal
      operationId: postFinanceJournal
      x-permission: finance.journal.post
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Posted journal.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [journal]
                properties:
                  journal: { $ref: '#/components/schemas/FinanceJournal' }
        '403': { description: Missing finance.journal.post permission. }
        '404': { description: Journal not found. }
        '409': { description: Journal is not a balanced DRAFT. }
  /api/finance/journals/{id}/reverse:
    post:
      tags: [Finance]
      summary: Reverse a posted journal
      description: Creates a balancing reversal journal and links it to the original.
      operationId: reverseFinanceJournal
      x-permission: finance.journal.post
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reversal journal.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [journal]
                properties:
                  journal: { $ref: '#/components/schemas/FinanceJournal' }
        '403': { description: Missing finance.journal.post permission. }
        '404': { description: Journal not found. }
        '409': { description: Only POSTED journals can be reversed, or it was already reversed. }
  /api/finance/invoices:
    get:
      tags: [Finance]
      summary: List finance invoices
      operationId: listFinanceInvoices
      x-permission: finance.invoice.read
      security:
        - bearerAuth: []
      parameters:
        - name: direction
          in: query
          schema: { type: string, enum: [SALES, PURCHASE] }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, ISSUED, PARTIALLY_PAID, PAID, OVERDUE, CANCELLED] }
        - name: partyId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Invoices visible to the caller; money fields are integer cents.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [invoices]
                properties:
                  invoices:
                    type: array
                    items: { $ref: '#/components/schemas/FinanceInvoice' }
        '403': { description: Missing finance.invoice.read permission. }
    post:
      tags: [Finance]
      summary: Create a draft invoice
      description: Computes subtotal/tax/total in integer cents using a VERIFIED statutory rate when supplied. New invoices are DRAFT.
      operationId: createFinanceInvoice
      x-permission: finance.invoice.write
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceInvoiceCreateRequest'
      responses:
        '201':
          description: Created draft invoice.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [invoice]
                properties:
                  invoice: { $ref: '#/components/schemas/FinanceInvoice' }
        '400': { description: Invalid invoice, lines or party. }
        '403': { description: Missing finance.invoice.write permission. }
        '409': { description: A VERIFIED rate is required for a taxed invoice. }
  /api/finance/invoices/{id}:
    get:
      tags: [Finance]
      summary: Get an invoice with its lines
      operationId: getFinanceInvoice
      x-permission: finance.invoice.read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Invoice detail including lines.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [invoice]
                properties:
                  invoice: { $ref: '#/components/schemas/FinanceInvoice' }
        '403': { description: Missing finance.invoice.read permission. }
        '404': { description: Invoice not found. }
  /api/finance/invoices/{id}/issue:
    post:
      tags: [Finance]
      summary: Issue a draft invoice
      description: Fails with 409 unless the applied statutory rate is VERIFIED and effective on the issue date. This endpoint never verifies a rate on the caller's behalf.
      operationId: issueFinanceInvoice
      x-permission: finance.invoice.issue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                taxRateId:
                  type: string
                  description: Optional VERIFIED, effective rate to apply when the invoice has none.
      responses:
        '200':
          description: Issued invoice.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [invoice]
                properties:
                  invoice: { $ref: '#/components/schemas/FinanceInvoice' }
        '403': { description: Missing finance.invoice.issue permission. }
        '404': { description: Invoice not found. }
        '409': { description: Invoice is not DRAFT, or the rate is UNVERIFIED/not effective. }
  /api/finance/payments:
    get:
      tags: [Finance]
      summary: List payments
      operationId: listFinancePayments
      x-permission: finance.payment.read
      security:
        - bearerAuth: []
      parameters:
        - name: direction
          in: query
          schema: { type: string, enum: [INCOMING, OUTGOING] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Payments visible to the caller.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [payments]
                properties:
