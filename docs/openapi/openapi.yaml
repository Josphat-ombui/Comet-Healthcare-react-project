        id: { type: string }
        accountId: { type: string }
        partyId: { type: string, nullable: true }
        debitCents: { type: integer, minimum: 0, description: Integer cents. }
        creditCents: { type: integer, minimum: 0, description: Integer cents. }
        memo: { type: string, nullable: true }
        position: { type: integer }
    FinanceJournal:
      type: object
      required: [id, number, date, description, status]
      properties:
