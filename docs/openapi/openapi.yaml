        '200':
          description: Per-widget run ID, status and result summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportingDashboardSummaryEnvelope' }
        '401': { description: Missing or invalid bearer token. }
        '403': { description: Missing `reporting.dashboard.read`. }
        '404': { description: Tenant-scoped dashboard not found. }
  /api/reporting/dashboards/{dashboardId}/widgets:
