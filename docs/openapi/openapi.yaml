        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportingDashboardUpdate' }
      responses:
        '200':
          description: Updated dashboard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportingDashboardEnvelope' }
        '400': { description: Invalid request or DLP rejection. }
